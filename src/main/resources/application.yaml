spring:
  application:
    name: AnsweringBot
  config:
    import: "optional:file:.env[.properties]"
  ai:
    chat:
      client:
        enabled: false
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 500ms
        multiplier: 2
        max-interval: 2s
    openai:
      base-url: https://openrouter.ai/api/v1
      api-key: ${OPENROUTER_API:}
      chat:
        max-retries: 1
        options:
          model: ${OPENROUTER_MODEL:deepseek/deepseek-chat}
    google:
      genai:
        api-key: ${GEMINI_API:}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-2.5-flash-lite}

telegram-bot:
  token: ${TELEGRAM_BOT_API:}
  enabled: true
  allowed-chat-ids: []
  branch-max-depth: 20
  branch-cache-max-size: 2000
  branch-cache-ttl: 24h
  system-prompt: >
    Ты краткий и информативный справочный ассистент в групповом чате Telegram.
    Отвечай кратко, точно и по существу на языке вопроса пользователя.
    Если вопрос задан к пересланному или цитируемому сообщению, опирайся на его текст и контекст ветки.
    Не добавляй лишних вступлений, воды и дисклеймеров.
